name: CI and Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        env:
          IMAGE_NAME: gilangp/sec-forbes-app
          BRANCH: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${SHORT_SHA:0:8}
          docker build \
            --progress plain \
            --tag ${IMAGE_NAME}:${BRANCH}${SHORT_SHA} \
            --tag ${IMAGE_NAME}:${BRANCH} \
            -f Dockerfile .
          docker push ${IMAGE_NAME}:${BRANCH}${SHORT_SHA}
          docker push ${IMAGE_NAME}:${BRANCH}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    container:
      image: gilangp/tools:ansible.2.13.10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write Ansible inventory from secret
        run: echo "${{ secrets.ANSIBLE_HOSTS }}" > inventory.ini

      - name: Setup SSH key
        run: |
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Install required collections
        run: ansible-galaxy collection install community.docker:==3.10.0

      - name: Deploy with Ansible
        shell: bash
        run: |
          ansible-playbook -i inventory.ini deploy/develop.yml --private-key key.pem -e "CI_COMMIT_SHORT_SHA=${GITHUB_SHA::8}"
