version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
    environment:
      CI_ENV: development
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: forbes_app
      MYSQL_USER: forbes_user
      MYSQL_PASSWORD: forbes_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
